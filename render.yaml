services:
  # Backend Web Service
  - type: web
    name: woman-basic-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run production
    envVars:
      - key: BUILD_MODE
        value: production
      - key: DATABASE_NAME
        value: WomanBasic
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CLIENT_URL
        value: https://womanbasic.onrender.com

  # Frontend Static Site
  - type: web
    name: womanbasic
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_ROOT
        value: https://woman-basic-backend.onrender.com
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html

